
name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      # NEW STEP: Install FastAPI CLI
      - name: Install FastAPI CLI
        run: uv tool install "fastapi[standard]"

      - name: Deploy to FastAPI Cloud
        run: uv run --with "fastapi[standard]" fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Verify API health
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error \
              https://new-repo.fastapicloud.dev/health; then
              echo "API is healthy!"
              exit 0
            fi

            echo "API not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "API health check failed!"
          exit 1
