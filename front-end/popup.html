
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <h2>PagePal</h2>
      <p>Your webpage AI assistant</p>
    </header>

    <!-- Automatic webpage analysis -->
    <section id="analyze-screen">
      <p id="page-url">Getting current webpage...</p>

      <div id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Starting analysis...</p>

        <div class="progress-track">
          <div id="progress-bar"></div>
        </div>

        <p id="progress-percent">0%</p>
      </div>

      <p id="status"></p>
      <button id="retry-btn" hidden>Try again</button>
    </section>

    <!-- Chat opens after analysis succeeds -->
    <section id="chat-screen" hidden>
      <p id="chat-page-title"></p>

      <div id="chat-messages"></div>

      <form id="chat-form">
        <input
          id="question"
          type="text"
          placeholder="Ask about this webpage..."
          required
        >
        <button id="send-btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
